<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>大五人格测试 | 发现你的五维特质</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #f5f7fc 0%, #eef2f8 100%);
            font-family: system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', 'Noto Sans', sans-serif;
            padding: 20px 16px 50px;
            color: #1e2f3f;
        }

        .container {
            max-width: 620px;
            margin: 0 auto;
        }

        /* 头部卡片 */
        .hero {
            background: white;
            border-radius: 48px 32px 48px 32px;
            padding: 28px 24px;
            margin-bottom: 24px;
            box-shadow: 0 12px 24px rgba(0,0,0,0.05);
            text-align: center;
            border: 1px solid #e5decf;
        }

        .hero h1 {
            font-size: 2rem;
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, #3b6e6b, #2c5956);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 8px;
        }

        .hero p {
            color: #4a627a;
            font-size: 0.95rem;
            margin-top: 10px;
        }

        .badge {
            display: inline-block;
            background: #eef2f0;
            border-radius: 40px;
            padding: 6px 16px;
            font-size: 0.75rem;
            font-weight: 500;
            color: #2c6e6a;
            margin-top: 12px;
        }

        /* 问卷卡片 */
        .question-card {
            background: white;
            border-radius: 32px;
            padding: 20px 22px;
            margin-bottom: 18px;
            box-shadow: 0 6px 14px rgba(0,0,0,0.03);
            transition: all 0.2s;
            border: 1px solid #e9edf2;
        }

        .question-text {
            font-weight: 600;
            font-size: 1.04rem;
            line-height: 1.4;
            margin-bottom: 20px;
            color: #1e2f3f;
            padding-right: 4px;
        }

        /* 五分制 选项组 */
        .rating-group {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            flex-wrap: wrap;
        }

        .rating-option {
            flex: 1;
            min-width: 55px;
            background: #F8FAFE;
            border-radius: 60px;
            text-align: center;
            padding: 8px 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid #e2e8f0;
            font-weight: 500;
            font-size: 0.85rem;
            color: #2c445e;
        }

        .rating-option.selected {
            background: #cbdde0;
            background: linear-gradient(145deg, #8fc1bc, #6faaa4);
            border-color: #3b7e79;
            color: white;
            box-shadow: 0 4px 8px rgba(55, 94, 87, 0.2);
            transform: scale(0.97);
        }

        /* 提交按钮 */
        .submit-btn {
            width: 100%;
            background: #2d5a56;
            background: linear-gradient(98deg, #2c6e68, #1f554f);
            border: none;
            padding: 18px 20px;
            border-radius: 60px;
            font-size: 1.2rem;
            font-weight: 700;
            color: white;
            margin: 12px 0 24px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 8px 18px rgba(0,0,0,0.1);
            letter-spacing: 1px;
        }

        .submit-btn:active {
            transform: scale(0.97);
            background: #1f554f;
        }

        /* 结果区域 */
        .result-container {
            background: white;
            border-radius: 40px;
            padding: 28px 24px;
            margin-top: 28px;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.08);
            transition: all 0.3s;
            border: 1px solid #d4e0dd;
        }

        .result-header {
            font-size: 1.5rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 20px;
            color: #2c6e68;
        }

        .scores-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin: 24px 0 16px;
        }

        .score-chip {
            background: #f1f5f9;
            border-radius: 100px;
            padding: 8px 20px;
            font-weight: 600;
            font-size: 1rem;
            display: inline-flex;
            align-items: baseline;
            gap: 8px;
            box-shadow: inset 0 0 0 1px rgba(0,0,0,0.02), 0 2px 4px rgba(0,0,0,0.02);
        }

        .score-number {
            font-size: 1.5rem;
            font-weight: 800;
            color: #1c6d67;
            margin-left: 6px;
        }

        .interpretation {
            background: #FDFBF5;
            border-radius: 28px;
            padding: 20px;
            margin-top: 22px;
            border-left: 8px solid #6faaa4;
        }

        .interpretation h3 {
            font-size: 1.3rem;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .interpretation p {
            line-height: 1.5;
            color: #2d3e4e;
            margin-bottom: 12px;
        }

        .tips-box {
            background: #e7f0ef;
            border-radius: 24px;
            padding: 16px;
            margin-top: 18px;
            font-size: 0.9rem;
        }

        .reset-link {
            text-align: center;
            margin-top: 24px;
        }

        .reset-btn {
            background: none;
            border: none;
            color: #5f8b86;
            text-decoration: underline;
            font-size: 0.85rem;
            cursor: pointer;
        }

        footer {
            text-align: center;
            font-size: 0.7rem;
            color: #9badbc;
            margin-top: 30px;
        }
        @media (max-width: 480px) {
            .rating-option {
                min-width: 48px;
                font-size: 0.72rem;
                padding: 6px 2px;
            }
            .question-text {
                font-size: 0.96rem;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="hero">
        <h1>🌊 大五人格 · 五维光谱</h1>
        <p>开放性 | 尽责性 | 外向性 | 宜人性 | 神经质</p>
        <div class="badge">📋 15题经典快速版 · 探索你的核心特质</div>
    </div>

    <div id="questionsArea"></div>

    <button class="submit-btn" id="submitTest">✨ 生成我的人格图谱 ✨</button>

    <div id="resultArea" style="display: none;"></div>
    <footer>基于大五人格理论 (BFI-2精简版) · 洞见天赋与成长方向</footer>
</div>

<script>
    // ================= 大五人格问卷 (15题，每个维度3题，含反向计分标记R) =================
    // 维度: O (开放性), C (尽责性), E (外向性), A (宜人性), N (神经质/情绪稳定性反向)
    // 格式: { text: "题目", trait: "O", reverse: false }
    const questions = [
        { text: "我经常尝试新的事物，喜欢艺术和冒险体验。", trait: "O", reverse: false },
        { text: "我做事周到、彻底，追求有条理。", trait: "C", reverse: false },
        { text: "我很容易融入社交场合，喜欢成为焦点。", trait: "E", reverse: false },
        { text: "我同情他人的感受，愿意帮助别人。", trait: "A", reverse: false },
        { text: "我容易紧张，经常感到焦虑。", trait: "N", reverse: false },
        { text: "我对抽象概念和复杂理论不太感兴趣。", trait: "O", reverse: true },   // 反向: 低开放性倾向
        { text: "我经常忘记把东西放回原位，有些杂乱。", trait: "C", reverse: true },   // 反向: 低尽责性
        { text: "我喜欢一个人安静独处，而不是热闹聚会。", trait: "E", reverse: true },   // 反向: 内向倾向
        { text: "我有时对人比较冷淡，不太在意他人麻烦。", trait: "A", reverse: true },   // 反向: 低宜人性
        { text: "我大部分时间心情平静，很少情绪波动。", trait: "N", reverse: true },   // 反向: 低神经质 (情绪稳定)
        { text: "我富有想象力和创造力，喜欢新奇想法。", trait: "O", reverse: false },
        { text: "我会制定计划并坚持执行到底。", trait: "C", reverse: false },
        { text: "我充满活力，喜欢主动结交朋友。", trait: "E", reverse: false },
        { text: "我相信人性本善，愿意合作妥协。", trait: "A", reverse: false },
        { text: "我常常感到压力大，容易沮丧。", trait: "N", reverse: false }
    ];

    // 五大人格维度元数据
    const traitMeta = {
        O: { name: "🌿 开放性", full: "开放性 (Openness)", description: "想象力、审美、情感丰富、好奇、创新 vs 传统务实" },
        C: { name: "📊 尽责性", full: "尽责性 (Conscientiousness)", description: "自律、条理、成就动机、深思熟虑 vs 随性不拘" },
        E: { name: "🎉 外向性", full: "外向性 (Extraversion)", description: "热情、社交、活力、乐观 vs 内向安静" },
        A: { name: "❤️ 宜人性", full: "宜人性 (Agreeableness)", description: "信任、利他、温和、合作 vs 竞争性、质疑" },
        N: { name: "😓 神经质", full: "神经质 / 情绪稳定性", description: "焦虑、抑郁、脆弱、情绪波动 vs 情绪韧性强" }
    };

    // 存储每个维度原始总分 (3~15分区间)
    let answers = new Array(questions.length).fill(null);

    // 渲染问卷
    function renderQuestions() {
        const container = document.getElementById("questionsArea");
        if (!container) return;
        let html = '';
        questions.forEach((q, idx) => {
            const selectedVal = answers[idx];
            const selectedNum = selectedVal !== null ? selectedVal : 0;
            html += `
                <div class="question-card" data-qidx="${idx}">
                    <div class="question-text">${idx+1}. ${q.text}</div>
                    <div class="rating-group" data-qid="${idx}">
                        ${[1,2,3,4,5].map(score => `
                            <div class="rating-option ${selectedNum === score ? 'selected' : ''}" data-score="${score}">
                                ${score===1?'❌ 1':score===2?'🌱 2':score===3?'⚖️ 3':score===4?'✅ 4':'✨ 5'}
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;

        // 绑定选项事件
        document.querySelectorAll('.rating-group').forEach(group => {
            const qIdx = parseInt(group.getAttribute('data-qid'));
            const options = group.querySelectorAll('.rating-option');
            options.forEach(opt => {
                opt.addEventListener('click', (e) => {
                    const score = parseInt(opt.getAttribute('data-score'));
                    answers[qIdx] = score;
                    options.forEach(inner => inner.classList.remove('selected'));
                    opt.classList.add('selected');
                });
            });
        });
    }

    // 计算五个维度得分 (每个维度3题，考虑反向计分后总分范围3-15，同时转换为标准化5分制展示友好)
    function computeTraitScores() {
        // 初始化每个维度的原始总分
        let rawScores = { O: 0, C: 0, E: 0, A: 0, N: 0 };
        // 记录每个维度题目个数 (均3)
        const countMap = { O: 0, C: 0, E: 0, A: 0, N: 0 };
        
        for (let i = 0; i < questions.length; i++) {
            const q = questions[i];
            let score = answers[i];
            if (score === null) continue; // 尚未回答时不计入，提交时会拦截
            let finalScore = score;
            if (q.reverse) {
                // 反向计分: 1->5, 2->4, 3->3, 4->2, 5->1
                finalScore = 6 - score;
            }
            rawScores[q.trait] += finalScore;
            countMap[q.trait] += 1;
        }
        // 为确保展示一致性，将原始总分(3-15)转化为1-5的标准化分数（便于理解）
        let normalized = {};
        for (let trait of ['O', 'C', 'E', 'A', 'N']) {
            const raw = rawScores[trait];
            // 原始分数范围3~15 (3题每题1~5分)
            // 映射到1~5分: normalized = (raw - 3) / 12 * 4 + 1 = (raw-3)/3 + 1 ？更精准用比例
            // 公式: (raw - 3) / 12 * 4 + 1 = (raw-3)/3 + 1  因为3->1分，15->5分
            const norm = ((raw - 3) / 12) * 4 + 1;  // raw=3时=1, raw=15时=5
            normalized[trait] = Math.round(norm * 10) / 10; // 保留一位小数
        }
        return { rawScores, normalized, countMap };
    }

    // 根据各维度分数生成深度解读 + tips
    function generateInterpretation(normalized, rawScores) {
        // 将五个维度排序，找到最高和最低
        let entries = Object.entries(normalized).map(([key, val]) => ({ key, val, raw: rawScores[key] }));
        entries.sort((a,b) => b.val - a.val);
        const highest = entries[0];
        const lowest = entries[4];
        
        // 构建个性画像短评
        let highDesc = "";
        let lowDesc = "";
        let careerAdvice = "";
        
        // 对每个维度做独立深度解读动态生成 (根据分数区间)
        let dimensionDetails = "";
        const traitsList = ['O', 'C', 'E', 'A', 'N'];
        for (let t of traitsList) {
            const scoreVal = normalized[t];
            const rawVal = rawScores[t];
            const meta = traitMeta[t];
            let level = "";
            let traitTip = "";
            if (scoreVal >= 4.0) level = "🔹 高分倾向 · 非常明显";
            else if (scoreVal >= 3.0) level = "🔸 中等倾向 · 平衡灵活";
            else level = "🔻 低分倾向 · 相反端明显";
            
            if (t === 'O') {
                if (scoreVal >= 4) traitTip = "创新驱动，拥抱变化，适合艺术、研发、战略策划。避免过于天马行空。";
                else if (scoreVal <= 2.5) traitTip = "务实传统，偏好稳定明确的流程，适合执行、财务、标准化岗位。可尝试小幅创新。";
                else traitTip = "既享受新意也尊重传统，善于在变革中保持稳健。";
            } else if (t === 'C') {
                if (scoreVal >= 4) traitTip = "自律成就导向，高效可靠。适合管理、项目管理、法律。放松一些会更灵活。";
                else if (scoreVal <= 2.5) traitTip = "随性适应，富有弹性，适合作息创意、自由职业。提升条理化将释放更多潜力。";
                else traitTip = "有条理但不刻板，能兼顾计划与灵活，是团队中坚力量。";
            } else if (t === 'E') {
                if (scoreVal >= 4) traitTip = "社交能量充沛，喜欢合作和表达，适合销售、市场、培训。注意倾听。";
                else if (scoreVal <= 2.5) traitTip = "内心深沉，专注独立，适合研发、写作、分析。适当社交提升职场能见度。";
                else traitTip = "内外向平衡，既享受互动也能独处充电，具备广泛的适应力。";
            } else if (t === 'A') {
                if (scoreVal >= 4) traitTip = "高同理心，善于合作，适合HR、咨询、护理。注意设立边界防止过度妥协。";
                else if (scoreVal <= 2.5) traitTip = "目标为王，独立思考，适合竞争性岗位（法律、谈判）。培养共情强化协作。";
                else traitTip = "理性兼具善意，能平衡温情与原则。";
            } else if (t === 'N') {
                if (scoreVal >= 4) traitTip = "情绪感知敏锐，适合心理咨询、艺术创作。留意压力管理，可以练习正念。";
                else if (scoreVal <= 2.5) traitTip = "情绪稳定，抗压能力强，适合急诊、危机管理、军队。偶尔表达柔软更有亲和力。";
                else traitTip = "情绪韧性良好，大部分情况下从容应对挑战。";
            }
            
            dimensionDetails += `
                <div style="margin-bottom: 14px; border-bottom: 1px dashed #d4e0dd; padding-bottom: 10px;">
                    <strong>${meta.name}</strong> 得分 ${scoreVal} / 5 (原始分 ${rawVal}/15) · ${level}<br>
                    <span style="font-size:0.85rem; color:#3f6b66;">💡 ${traitTip}</span>
                </div>
            `;
        }
        
        // 针对最高和最低特质做整合描述
        const highMeta = traitMeta[highest.key];
        const lowMeta = traitMeta[lowest.key];
        const coreDesc = `✨ 您的核心特质是「${highMeta.name}」倾向显著 (得分${highest.val})，而「${lowMeta.name}」相对较弱 (得分${lowest.val})。${highest.key === 'O' ? '喜欢新鲜体验和概念思考' : (highest.key==='C'?'做事有规划且靠谱':(highest.key==='E'?'热情外向，喜欢与人连接':(highest.key==='A'?'温和信任他人，团队润滑剂':'情绪敏感性强，感知细腻')))}。`;
        
        let overallAdvice = "";
        if (highest.key === 'N' && highest.val >= 4.2) overallAdvice = "你的情绪雷达非常灵敏，建议多加冥想、运动或书写释放，把感受力转化为创造力。";
        else if (lowest.key === 'C' && lowest.val <= 2.3) overallAdvice = "可尝试一些每日小计划，微习惯帮助你提升效率又不失自由。";
        else overallAdvice = "你的性格组合适应多数场景，关键是根据能量状态选择合适的任务类型。";
        
        return `
            <div class="interpretation">
                <h3>🧬 大五人格·深度剖面</h3>
                <p>${coreDesc}</p>
                <div class="tips-box" style="margin-bottom: 12px;">
                    🎯 <strong>整体画像：</strong>${overallAdvice}
                </div>
                <div style="margin: 12px 0 4px;"><strong>📐 各维度细分解读：</strong></div>
                ${dimensionDetails}
                <div class="tips-box" style="margin-top: 16px;">
                    🌟 大五人格理论强调：特质无绝对好坏，了解自己是发挥优势、管理盲点的第一步。你的可塑性远超想象。
                </div>
            </div>
        `;
    }
    
    // 显示结果并且视觉化分数
    function showResults() {
        // 检查是否全部作答
        const missingIndex = answers.findIndex(a => a === null);
        if (missingIndex !== -1) {
            alert(`请先完成第 ${missingIndex+1} 题（1-5分）再查看报告～`);
            const targetCard = document.querySelector(`.question-card[data-qidx="${missingIndex}"]`);
            if(targetCard) targetCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
            return;
        }
        
        const { normalized, rawScores } = computeTraitScores();
        // 生成带分数标签的html
        let chipsHtml = '';
        for (let [trait, score] of Object.entries(normalized)) {
            const meta = traitMeta[trait];
            let displayShort = meta.name;
            chipsHtml += `<div class="score-chip">${displayShort} <span class="score-number">${score}</span><span style="font-size:0.7rem;">/5</span></div>`;
        }
        
        const interpretationHtml = generateInterpretation(normalized, rawScores);
        
        const resultDiv = document.getElementById("resultArea");
        resultDiv.style.display = "block";
        resultDiv.innerHTML = `
            <div class="result-container">
                <div class="result-header">📈 你的大五人格能量光谱</div>
                <div class="scores-grid">
                    ${chipsHtml}
                </div>
                <div style="font-size:0.75rem; text-align:center; margin-bottom: 8px;">分值越高代表该特质越明显 (1 = 低, 5 = 高)</div>
                ${interpretationHtml}
                <div class="reset-link">
                    <button class="reset-btn" id="resetTestBtn">⟳ 重新测试 / 分享给朋友测一测</button>
                </div>
            </div>
        `;
        resultDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });
        
        const resetBtn = document.getElementById("resetTestBtn");
        if(resetBtn) {
            resetBtn.addEventListener('click', () => resetAllTest());
        }
    }
    
    function resetAllTest() {
        answers = new Array(questions.length).fill(null);
        renderQuestions();
        const resultDiv = document.getElementById("resultArea");
        resultDiv.style.display = "none";
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    
    function init() {
        renderQuestions();
        const submitBtn = document.getElementById("submitTest");
        if(submitBtn) submitBtn.addEventListener("click", showResults);
    }
    
    init();
</script>
</body>
</html>
